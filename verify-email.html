<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIC - Email 驗證</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }

        .logo {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 10px;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        .logo span {
            font-weight: 600;
            color: #c9a96e;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .message {
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
        }

        .loading {
            color: #666;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: #c9a96e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #b8995c;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f0f0f0;
            border-top-color: #c9a96e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">CHIC<span>.</span></div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>驗證中，請稍候...</p>
        </div>

        <div id="message" class="message" style="display: none;"></div>
        <div id="actions" style="display: none;">
            <a href="https://shopping.zeabur.app" class="btn">返回首頁</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://shopping-backend.zeabur.app';

        async function verifyEmail() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                showMessage('驗證碼不能為空', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/verify-email?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || '驗證失敗');
                }

                showMessage('Email 驗證成功！現在可以登入了。', 'success');
            } catch (error) {
                showMessage(error.message || '驗證失敗，請稍後再試', 'error');
            }
        }

        function showMessage(text, type) {
            document.getElementById('loading').style.display = 'none';
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = `message ${type}`;
            msgEl.style.display = 'block';
            document.getElementById('actions').style.display = 'block';
        }

        verifyEmail();
    </script>
</body>
</html>
